.option{

    border-radius:8px;
    cursor:pointer;
    font-size:18px;
    transition:.2s;
}
.option:hover{background:#777;}
.option.correct{background:#198754;}
.option.wrong{background:#dc3545;}
.option.disabled{pointer-events:none;opacity:.95;}
#timer{font-size:20px;color:#00eaff;margin:10px 0;}
.info{font-size:17px;color:#ddd;margin:8px 0;}
button, select{

    font-size:18px;
    border:none;
    border-radius:7px;
}
button{background:#28a745;color:white;cursor:pointer;}
button:hover{background:#218838;}
button.secondary{background:#0d6efd;}
button.secondary:hover{background:#0b5ed7;}
select{width:80%;max-width:420px;background:white;color:#222;text-align:center;}
#quizBox{display:none;}
#result{font-size:24px;line-height:1.8;margin-top:20px;color:#ffd700;}
.small{font-size:15px;color:#bbb;}
</style>
</head>

let currentQuestion = null;
let score = 0;
let time = 45;
let timer = null;
let answered = false;
let usedQuestionIndexes = [];
let selectedCategoryName = "";
let totalTarget = 0;
let totalAnswered = 0;
let sessionStarted = false;
let countedCurrentQuestion = false;

const categorySelect = document.getElementById("categorySelect");
const questionCountInput = document.getElementById("questionCount");
const nextBtn = document.querySelector("#quizBox button");
nextBtn.innerText = "العودة لاختيار فئة";
nextBtn.style.display = "none";

function fillCategories(){
    const categories = [...new Set(allQuestions.map(q => q.category))];
    categorySelect.innerHTML = "";

    categories.forEach(cat => {
        const count = allQuestions.filter(q => q.category === cat).length;
        const option = document.createElement("option");
        option.value = cat;
        option.textContent = cat + " (" + count + " سؤال)";
        categorySelect.appendChild(option);
    });

    updateCategoryCount();
}

categorySelect.addEventListener("change", updateCategoryCount);
questionCountInput.addEventListener("change", updateCategoryCount);

function getRemainingQuestions(cat){
    return allQuestions
        .map((q, index) => ({...q, originalIndex: index}))
        .filter(q => q.category === cat && !usedQuestionIndexes.includes(q.originalIndex));
}

function getTotalRemaining(){
    return allQuestions.length - usedQuestionIndexes.length;
}

function updateCategoryCount(){
    const cat = categorySelect.value;
    const total = allQuestions.filter(q => q.category === cat).length;
    const remaining = getRemainingQuestions(cat).length;

    if(!sessionStarted){
        const maxAll = allQuestions.length;
        questionCountInput.max = maxAll;
        if(parseInt(questionCountInput.value) > maxAll) questionCountInput.value = maxAll;
        if(parseInt(questionCountInput.value) < 1 || isNaN(parseInt(questionCountInput.value))) questionCountInput.value = 1;
        document.getElementById("categoryCount").innerText =
            "اختر إجمالي عدد الأسئلة للمسابقة، ثم اختر فئة في كل مرة. أسئلة هذه الفئة: " + total + " | المتبقي منها: " + remaining;
    } else {
        document.getElementById("categoryCount").innerText =
            "التقدم: " + totalAnswered + " من " + totalTarget +
            " | النتيجة: " + score +
            " | المتبقي في هذه الفئة: " + remaining;
    }
}

function startQuiz(){
    if(!sessionStarted){
        totalTarget = parseInt(questionCountInput.value);
        if(isNaN(totalTarget) || totalTarget < 1) totalTarget = 1;
        if(totalTarget > allQuestions.length) totalTarget = allQuestions.length;
        questionCountInput.value = totalTarget;
        questionCountInput.disabled = true;
        sessionStarted = true;
        score = 0;
        totalAnswered = 0;
        usedQuestionIndexes = [];
    }

    if(totalAnswered >= totalTarget){
        showFinalResult();
        return;
    }

    selectedCategoryName = categorySelect.value;
    let remainingQuestions = getRemainingQuestions(selectedCategoryName);

    if(remainingQuestions.length === 0){
        alert("انتهت أسئلة هذه الفئة، اختر فئة أخرى.");
        updateCategoryCount();
        return;
    }

    if(getTotalRemaining() === 0){
        showFinalResult();
        return;
    }

    // اختيار سؤال واحد فقط من الفئة المختارة
    currentQuestion = remainingQuestions.sort(() => Math.random() - 0.5)[0];
    answered = false;
    countedCurrentQuestion = false;

    document.getElementById("startBox").style.display = "none";
    document.getElementById("quizBox").style.display = "block";
    document.getElementById("result").innerHTML = "";
    document.getElementById("categoryName").innerText = "الفئة: " + selectedCategoryName;
    nextBtn.style.display = "none";
    nextBtn.innerText = "العودة لاختيار فئة";

    loadQuestion();
}

function startTimer(){
    time = 45;
    document.getElementById("timer").innerText = "الوقت: " + time;

    timer = setInterval(() => {
        time--;
        document.getElementById("timer").innerText = "الوقت: " + time;

        if(time <= 0){
            clearInterval(timer);
            finishSingleQuestion(false);
        }
    }, 1000);
}

function loadQuestion(){
    clearInterval(timer);
    answered = false;
    startTimer();

    document.getElementById("progress").innerText = "السؤال " + (totalAnswered + 1) + " من " + totalTarget + " | النتيجة: " + score;
    document.getElementById("question").innerText = currentQuestion.question;

    let optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";

    currentQuestion.options.forEach((option, index) => {
        let div = document.createElement("div");
        div.className = "option";
        div.innerText = option;
        div.onclick = () => selectAnswer(index, div);
        optionsDiv.appendChild(div);
    });
}

function selectAnswer(index, selectedDiv){
    if(answered) return;
    answered = true;
    clearInterval(timer);

    const correctIndex = currentQuestion.answer;
    const optionDivs = document.querySelectorAll(".option");

    optionDivs.forEach((div, i) => {
        div.classList.add("disabled");
        if(i === correctIndex) div.classList.add("correct");
    });

    if(index === correctIndex){
        score++;
        document.getElementById("correctSound").play();
    } else {
        selectedDiv.classList.add("wrong");
        document.getElementById("wrongSound").play();
    }

    finishSingleQuestion(true);
}

function finishSingleQuestion(showButton){
    if(!countedCurrentQuestion){
        countedCurrentQuestion = true;
        totalAnswered++;
        if(currentQuestion && !usedQuestionIndexes.includes(currentQuestion.originalIndex)){
            usedQuestionIndexes.push(currentQuestion.originalIndex);
        }
    }

    clearInterval(timer);
    answered = true;

    if(!showButton){
        const correctIndex = currentQuestion.answer;
        const optionDivs = document.querySelectorAll(".option");
        optionDivs.forEach((div, i) => {
            div.classList.add("disabled");
            if(i === correctIndex) div.classList.add("correct");
        });
    }

    document.getElementById("progress").innerText = "تمت الإجابة: " + totalAnswered + " من " + totalTarget + " | النتيجة: " + score;

    if(totalAnswered >= totalTarget){
        nextBtn.innerText = "عرض النتيجة النهائية";
    } else {
        nextBtn.innerText = "العودة لاختيار فئة";
    }
    nextBtn.style.display = "inline-block";
}

function nextQuestion(){
    if(totalAnswered >= totalTarget){
        showFinalResult();
    } else {
        returnToCategories();
    }
}

function returnToCategories(){
    clearInterval(timer);
    document.getElementById("startBox").style.display = "block";
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("result").innerHTML = "";
    nextBtn.style.display = "none";
    updateCategoryCount();
}

function showFinalResult(){
    clearInterval(timer);
    document.getElementById("startBox").style.display = "none";
    document.getElementById("quizBox").style.display = "none";
    document.getElementById("result").innerHTML =
        "🏆 النتيجة النهائية: " + score + " / " + totalTarget +
        "<br><button onclick='restartQuiz()'>بدء مسابقة جديدة</button>";
    document.getElementById("winSound").play();
}

function restartQuiz(){
    clearInterval(timer);
    score = 0;
    totalAnswered = 0;
    totalTarget = 0;
    sessionStarted = false;
    usedQuestionIndexes = [];
    currentQuestion = null;
    countedCurrentQuestion = false;
    questionCountInput.disabled = false;
    document.getElementById("result").innerHTML = "";
    document.getElementById("startBox").style.display = "block";
    document.getElementById("quizBox").style.display = "none";
    nextBtn.style.display = "none";
    updateCategoryCount();
}

function resetAllQuestions(){
    restartQuiz();
    alert("تمت إعادة المسابقة من البداية");
}

// تعديل نصوص البداية بدون تغيير التصميم كثيرًا
const infoText = document.querySelector("#startBox .info");
if(infoText) infoText.innerText = "اختر إجمالي عدد الأسئلة، ثم اختر فئة لكل سؤال";
const countLabel = document.querySelector("label[for='questionCount']");
if(countLabel) countLabel.innerText = "إجمالي عدد الأسئلة:";
const startBtn = document.querySelector("#startBox button");
if(startBtn) startBtn.innerText = "اعرض سؤال من الفئة";

// زر بسيط لإعادة المسابقة من البداية بدون تغيير التصميم كثيرًا
const resetBtn = document.createElement("button");
resetBtn.className = "secondary";
resetBtn.innerText = "إعادة من البداية";
resetBtn.onclick = resetAllQuestions;
document.getElementById("startBox").appendChild(document.createElement("br"));
document.getElementById("startBox").appendChild(resetBtn);

fillCategories();
</script>
